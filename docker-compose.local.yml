name: silonr-local

x-app-environment: &app-environment
  NODE_ENV: production
  VITE_ENABLE_DEMO: "false"
  DEPLOYMENT_MODE: local
  APP_URL: https://${SILONR_LOCAL_SERVER}
  BETTER_AUTH_URL: https://${SILONR_LOCAL_SERVER}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?configure BETTER_AUTH_SECRET}
  ALLOW_PUBLIC_SIGNUP: "false"
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_SSL_MODE: disable
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://${SILONR_LOCAL_SERVER}:9443
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-silonr-evidence}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?configure S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?configure S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: "true"
  LICENSE_SERVICE_URL: ${LICENSE_SERVICE_URL:?configure LICENSE_SERVICE_URL}
  LICENSE_SERVICE_KEY: ${LICENSE_SERVICE_KEY:?configure LICENSE_SERVICE_KEY}
  LICENSE_SIGNING_PUBLIC_KEY: ${LICENSE_SIGNING_PUBLIC_KEY:?configure LICENSE_SIGNING_PUBLIC_KEY}
  LICENSE_INSTALLATION_ENCRYPTION_KEY: ${LICENSE_INSTALLATION_ENCRYPTION_KEY:?configure LICENSE_INSTALLATION_ENCRYPTION_KEY}
  LICENSE_REFRESH_INTERVAL_HOURS: ${LICENSE_REFRESH_INTERVAL_HOURS:-24}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?configure MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?configure MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - backend

  create-bucket:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?configure MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?configure MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-silonr-evidence}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?configure S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?configure S3_SECRET_ACCESS_KEY}
    networks:
      - backend
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        printf '%s' "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\",\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::${S3_BUCKET}\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::${S3_BUCKET}/*\"]}]}" >/tmp/app-policy.json
        mc anonymous set none "local/${S3_BUCKET}"
        mc admin user add local "${S3_ACCESS_KEY_ID}" "${S3_SECRET_ACCESS_KEY}" >/dev/null 2>&1 || mc admin user enable local "${S3_ACCESS_KEY_ID}" >/dev/null
        mc admin policy create local silonr-app /tmp/app-policy.json >/dev/null 2>&1 || mc admin policy info local silonr-app >/dev/null
        mc admin policy attach local silonr-app --user "${S3_ACCESS_KEY_ID}" >/dev/null

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    networks:
      - backend

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      SILONR_LOCAL_SERVER: ${SILONR_LOCAL_SERVER:?configure SILONR_LOCAL_SERVER}
    ports:
      - "${SILONR_LOCAL_BIND_IP}:443:443"
      - "${SILONR_LOCAL_BIND_IP}:9443:9443"
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - backend
      - edge

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
