services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: silonr
      POSTGRES_USER: silonr
      POSTGRES_PASSWORD: silonr-local-only
    ports:
      - "5432:5432"
    volumes:
      - silonr_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silonr -d silonr"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: silonr-local
      MINIO_ROOT_PASSWORD: silonr-local-secret-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silonr_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 silonr-local silonr-local-secret-change-me &&
      mc mb --ignore-existing local/silonr-private &&
      mc anonymous set none local/silonr-private;
      exit 0;
      "

volumes:
  silonr_postgres:
  silonr_minio:
