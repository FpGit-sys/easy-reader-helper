name: SiloNR CI

on:
  push:
    branches:
      - main
      - production/**
  pull_request:
    branches:
      - main

concurrency:
  group: silonr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate route tree
        run: bun run routes:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Validate database migrations can be generated
        env:
          DATABASE_URL: postgresql://silonr:silonr@127.0.0.1:5432/silonr
        run: bun run db:generate

      - name: Build
        run: bun run build
