name: SiloNR CI

on:
  push:
    branches:
      - main
      - production/**
  pull_request:
    branches:
      - main

concurrency:
  group: silonr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate route tree
        run: bun run routes:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Validate database migrations can be generated
        env:
          DATABASE_URL: postgresql://silonr:silonr@127.0.0.1:5432/silonr
        run: bun run db:generate

      - name: Build
        run: bun run build

  tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: silonr
          POSTGRES_PASSWORD: silonr
          POSTGRES_DB: silonr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silonr -d silonr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://silonr:silonr@127.0.0.1:5432/silonr_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: integration-only-secret-at-least-32-characters
      ALLOW_PUBLIC_SIGNUP: "false"
      VITE_ENABLE_DEMO: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create test schema
        run: bunx drizzle-kit push --force

      - name: Cross-tenant integration tests
        run: bun run test:integration
