name: SiloNR Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "desktop/**"
      - "src-tauri/**"
      - "scripts/windows-installer-smoke.ps1"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches:
      - "production/**"
    paths:
      - "desktop/**"
      - "src-tauri/**"
      - "scripts/windows-installer-smoke.ps1"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop-windows.yml"

concurrency:
  group: silonr-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JavaScript dependencies
        run: bun install

      - name: Generate desktop icons
        run: bun run tauri icon src-tauri/icons/app-icon.svg

      - name: Build Windows installers
        run: bun run desktop:build

      - name: Smoke install MSI and NSIS
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: SiloNR-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: SiloNR-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
