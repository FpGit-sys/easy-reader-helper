[package]
name = "silonr-desktop"
version = "0.1.0"
description = "Cliente desktop SiloNR"
authors = ["SiloNR"]
edition = "2021"

[lib]
name = "silonr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# CI-only shim so the real Tauri/SQLite process can run under Linux WebDriver.
# Windows release builds never enable this feature and continue to use DPAPI.
ci-insecure-store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography"
] }
