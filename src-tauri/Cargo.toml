[package]
name = "silonr-desktop"
version = "0.1.0"
description = "Cliente desktop SiloNR"
authors = ["SiloNR"]
edition = "2021"

[lib]
name = "silonr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
