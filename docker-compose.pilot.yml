name: silonr-pilot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - object_data:/data
    networks:
      - backend
      - edge

  create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-silonr-private}
    entrypoint: >-
      /bin/sh -c '
      set -eu;
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing "local/$${S3_BUCKET}";
      mc anonymous set none "local/$${S3_BUCKET}";
      cat > /tmp/silonr-app-policy.json <<EOF
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
            "Resource": ["arn:aws:s3:::$${S3_BUCKET}"]
          },
          {
            "Effect": "Allow",
            "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
            "Resource": ["arn:aws:s3:::$${S3_BUCKET}/*"]
          }
        ]
      }
      EOF
      mc admin user add local "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" >/dev/null 2>&1 || \
        mc admin user enable local "$${S3_ACCESS_KEY_ID}" >/dev/null;
      mc admin policy create local silonr-app /tmp/silonr-app-policy.json >/dev/null;
      mc admin policy attach local silonr-app --user "$${S3_ACCESS_KEY_ID}" >/dev/null;
      '
    networks:
      - backend

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment: &app_environment
      NODE_ENV: production
      VITE_ENABLE_DEMO: "false"
      APP_URL: https://${SILONR_DOMAIN:?SILONR_DOMAIN is required}
      BETTER_AUTH_URL: https://${SILONR_DOMAIN:?SILONR_DOMAIN is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      ALLOW_PUBLIC_SIGNUP: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # PostgreSQL is reachable only on the Compose-internal backend network.
      # Managed/external PostgreSQL deployments should use verify-full instead.
      DATABASE_SSL_MODE: disable
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${SILONR_FILES_DOMAIN:?SILONR_FILES_DOMAIN is required}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-silonr-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_FORCE_PATH_STYLE: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - backend

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *app_environment
    expose:
      - "3000"
    networks:
      - backend
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SILONR_DOMAIN: ${SILONR_DOMAIN:?SILONR_DOMAIN is required}
      SILONR_FILES_DOMAIN: ${SILONR_FILES_DOMAIN:?SILONR_FILES_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/pilot/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

volumes:
  postgres_data:
  object_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
